name: shellcheck

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Check shell syntax
        run: |
          bash -n u03-modem-switch
          shellcheck u03-modem-switch
          shellcheck tests/smoke.sh
      - name: Smoke test CLI
        run: tests/smoke.sh
