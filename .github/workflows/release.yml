name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  github-release:
    if: github.ref_type == 'tag' || github.event.head_commit.message == 'Enable automated GitHub releases'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v0.1.0"
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build Windows GUI
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          dotnet build windows/U03ModemSwitch/U03ModemSwitch.csproj \
            --configuration Release \
            -p:Version="$version"
          mkdir -p dist
          cp windows/U03ModemSwitch/bin/Release/net48/U03ModemSwitch.exe dist/U03ModemSwitch.exe
          (cd dist && sha256sum U03ModemSwitch.exe > SHA256SUMS.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            notes="docs/release-notes/$RELEASE_TAG.md"
            release_kind=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_kind+=(--prerelease)
            fi
            if [[ -f "$notes" ]]; then
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --title "$RELEASE_TAG" \
                "${release_kind[@]}" \
                --notes-file "$notes"
            else
              gh release create "$RELEASE_TAG" \
                --verify-tag \
                --title "$RELEASE_TAG" \
                "${release_kind[@]}" \
                --generate-notes
            fi
          fi

          gh release upload "$RELEASE_TAG" \
            dist/U03ModemSwitch.exe \
            dist/SHA256SUMS.txt \
            --clobber
